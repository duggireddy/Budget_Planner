services:
  mysql:
    image: mysql:8.0
    container_name: budget_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: budget_app
      MYSQL_USER: budget
      MYSQL_PASSWORD: budget
    ports:
      - "3306:3306"
    volumes:
      - budget_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ubudget", "-pbudget"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  budget_mysql_data:
